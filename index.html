html, body { margin: 0; }
body {

.panel { background: var(--panel); border: 3px solid var(--line); box-shadow: 6px 6px 0 var(--shadow); padding: 20px 20px 22px; min-width: 0; }
.panel > * + * { margin-top: 14px; }
h1 { font: 16px/1.6 var(--head); margin: 0; color: var(--ink); }
h2 { font: 13px/1.7 var(--head); margin: 0; color: var(--ink); }
p { margin: 0; }

.label { font: 9px/1.7 var(--head); color: var(--muted); margin-bottom: 6px; }

.answer p { font-size: 25px; max-width: 40em; }

.promise ul { list-style: none; margin: 0; padding: 0; }
.promise li { position: relative; padding-left: 24px; margin: 9px 0; font-size: 24px; max-width: 40em; }
.promise li::before { content: ""; position: absolute; left: 0; top: .42em; width: 11px; height: 11px; background: var(--warm); box-shadow: 0 0 0 3px #5b4320; }
.letter p { font-size: 26px; max-width: 36em; }
.letter p + p { margin-top: 14px; }
.sign { margin-top: 18px; color: var(--warm); }
.actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.btn {
  font: 10px/1.5 var(--head); color: var(--ink); background: var(--panel2);
  border: 3px solid var(--line); padding: 13px 15px; cursor: pointer; box-shadow: 4px 4px 0 var(--shadow);

.btn.primary { background: var(--warm); color: #1c1232; border-color: #ffdca8; }
.btn.small { padding: 8px 10px; font-size: 9px; }
.btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--shadow); }
.btn[disabled] { opacity: .5; cursor: default; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
.reveal { animation: fade .5s ease both; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .reveal { animation: none; } }
.walking { color: var(--muted); }
@media (max-width: 520px) {

  h1 { font-size: 13px; }
  .panel { padding: 16px 14px 18px; }
  .q { font-size: 22px; }

      '<p class="lead">Escribiste 47 errores en tu lista y dejaste vacíos el 48 y el 49. Aquí los recorremos uno por uno, caminando. En cada parada lees lo que escribiste, lo que respondo y lo que prometo.</p>' +
      '<p class="lead">Puedes parar cuando quieras. Seguir caminando no significa perdonar nada.</p>' +
      '<div class="actions">';
    if (saved > 0 && saved <= N) html += '<button class="btn primary" data-act="continue" type="button">Seguir donde quedé</button><button class="btn" data-act="start" type="button">Empezar de nuevo</button>';
    else html += '<button class="btn primary" data-act="start" type="button">Empezar</button>';
    html += '</div><p class="label">Hay música suave. La activas arriba, cuando quieras.</p>';
    panel.innerHTML = html;
    updateHeader();
  }

  function renderWalking() {
    var n = state.targetIdx < N ? 'Siguiente parada: ' + (state.targetIdx + 1) + ' de ' + N + '.' : 'Ya casi llegamos al final del camino.';
    panel.innerHTML = '<p class="walking reveal">Caminando… ' + n + '</p>';
    updateHeader();
  }

  function levelHtml() {
    var L = LEVELS[state.cur];
    var s = state.step;
    var kick = 'Parada ' + (state.cur + 1) + ' de ' + N + ' · ' + (L.ids.length > 1 ? 'Errores ' : 'Error ') + listEs(L.ids);
    var h = '<p class="kicker">' + esc(kick) + '</p>';
    h += '<section class="quote' + (s > 0 ? ' muted' : '') + '"><p class="label">Lo que escribiste</p>' +
      L.ids.map(function (n) { return '<p class="q"><span class="n">' + n + '.</span> ' + esc(E[n]) + '</p>'; }).join('') + '</section>';
    if (s >= 1) h += '<section class="answer' + (s === 1 ? ' reveal' : '') + '" id="ans"><p class="label">Lo que respondo</p>' + L.answer.map(function (t) { return '<p>' + esc(t) + '</p>'; }).join('') + '</section>';
    if (s >= 2) h += '<section class="promise reveal" id="prm"><p class="label">Lo que prometo</p><ul>' + L.promises.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul></section>';
    var btn = s === 0 ? 'Leer mi respuesta' : (s === 1 ? 'Lo que prometo' : 'Seguir caminando');
    h += '<div class="actions"><button class="btn primary" data-act="next" type="button">' + btn + '</button><button class="btn" data-act="pause" type="button">Necesito parar un momento</button></div>';
    return h;
  }

  function renderLevel() {
    panel.innerHTML = levelHtml();
    updateHeader();
    var target = state.step === 1 ? document.getElementById('ans') : (state.step === 2 ? document.getElementById('prm') : panel);
    scrollToPanel(target);
  }

  function renderPause() {
    panel.innerHTML = '<h2>Está bien.</h2><p class="lead">Esto no tiene prisa. Tu avance queda guardado en este dispositivo y puedes volver cuando quieras.</p><div class="actions"><button class="btn primary" data-act="resume" type="button">Seguir desde aquí</button></div>';
  }

  function endScenes() {
    var s = ['doors'];
    if (VALORES.length) s.push('values');
    s.push('letter');
    return s;
  }

  function renderEnd() {
    var scenes = endScenes();
    var sc = scenes[state.endStep];
    var last = state.endStep === scenes.length - 1;
    var h = '';
    if (sc === 'doors') {
      h = '<p class="kicker">Errores 48 y 49</p><h2>Las dos puertas</h2>' +
        '<p class="lead">Tú los dejaste vacíos y yo no los llené. Son tuyos. Si algún día quieres escribir algo ahí, o dejarlos vacíos, está bien.</p>';
    } else if (sc === 'values') {
      h = '<p class="kicker">Lo que veo en ti</p><h2>Lo que valoro de ti</h2><section class="promise"><ul>' + VALORES.map(function (v) { return '<li>' + esc(v) + '</li>'; }).join('') + '</ul></section>';
    } else {
      h = '<p class="kicker">Al final del camino</p><h2>Para ti</h2><section class="letter">' + CARTA.map(function (t) { return '<p>' + esc(t) + '</p>'; }).join('') + (FIRMA ? '<p class="sign">' + esc(FIRMA) + '</p>' : '') + '</section>';
    }
    h += '<div class="actions">' + (last ? '<button class="btn" data-act="restart" type="button">Recorrerlo otra vez desde el principio</button>' : '<button class="btn primary" data-act="endnext" type="button">Seguir</button>') + '</div>';
    panel.innerHTML = h;
    updateHeader();
    scrollToPanel(panel);
  }

  /* ================= FLUJO ================= */

  function startWalk(idx) {
    state.mode = 'walking';
    state.targetIdx = idx;
    state.target = idx < N ? stationX(idx) : stationX(N) - 4;
    state.cur = Math.min(idx, N - 1);
    state.walkT = 0;
    state.paused = false;
    renderWalking();
    if (reduce) { state.charX = state.target; arrive(); }
  }

  function arrive() {
    if (state.targetIdx < N) {
      state.mode = 'dialog'; state.step = 0; state.cur = state.targetIdx;
      renderLevel();
    } else {
      state.mode = 'end'; state.endStep = 0;
      renderEnd();
    }
  }

  function finishLevel() {
    state.done = Math.max(state.done, state.cur + 1);
    writeSave(state.done);
    chime();
    startWalk(state.cur + 1);
  }

  panel.addEventListener('click', function (ev) {
    var b = ev.target.closest ? ev.target.closest('[data-act]') : null;
    if (!b) return;
    var a = b.getAttribute('data-act');
    if (a === 'start') { state.done = 0; writeSave(0); state.charX = 0; startWalk(0); }
    else if (a === 'continue') { state.done = loadSave(); state.charX = Math.max(0, stationX(Math.min(state.done, N)) - 110); startWalk(Math.min(state.done, N)); }
    else if (a === 'next') { if (state.step < 2) { state.step++; renderLevel(); } else finishLevel(); }
    else if (a === 'pause') { state.paused = true; renderPause(); }
    else if (a === 'resume') { state.paused = false; renderLevel(); }
    else if (a === 'endnext') { state.endStep++; renderEnd(); }
    else if (a === 'restart') { state.done = 0; writeSave(0); state.mode = 'title'; state.charX = 0; renderTitle(); }
  });

  /* ================= MÚSICA ================= */

  var ac = null, master = null, musicOn = false, mTimer = null, nextT = 0, stepN = 0;
  var CH = [
    { b: 45, t: [57, 60, 64, 69] },
    { b: 41, t: [53, 57, 60, 65] },
    { b: 48, t: [55, 60, 64, 67] },
    { b: 43, t: [55, 59, 62, 67] }
  ];
  var PAT = [0, 1, 2, 3, 2, 1, 2, 3];
  var STEP_S = 60 / 66 / 2;
  function mtof(m) { return 440 * Math.pow(2, (m - 69) / 12); }

  function tone(type, f, t0, dur, vol) {
    var o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }
  function schedule() {
    if (!ac) return;
    while (nextT < ac.currentTime + 0.6) {
      var bar = Math.floor(stepN / 8) % 4, k = stepN % 8, c = CH[bar];
      tone('square', mtof(c.t[PAT[k]]), nextT, STEP_S * 1.6, 0.022);
      if (k === 0 || k === 4) tone('triangle', mtof(c.b), nextT, STEP_S * 3.6, 0.07);
      if (k === 0 && bar % 2 === 1) tone('sine', mtof(c.t[3] + 12), nextT + STEP_S, STEP_S * 5, 0.03);
      nextT += STEP_S; stepN++;
    }
  }
  function setMusic(on) {
    var btn = document.getElementById('musicBtn');
    try {
      if (on) {
        if (!ac) {
          var AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          ac = new AC(); master = ac.createGain(); master.gain.value = 0.9; master.connect(ac.destination);
        }
        if (ac.resume) ac.resume();
        nextT = ac.currentTime + 0.1;
        if (!mTimer) mTimer = setInterval(schedule, 150);
        musicOn = true;
      } else {
        musicOn = false;
        if (mTimer) { clearInterval(mTimer); mTimer = null; }
        if (ac && ac.suspend) ac.suspend();
      }
    } catch (e) { musicOn = false; }
    btn.textContent = '♪ Música: ' + (musicOn ? 'sí' : 'no');
    btn.setAttribute('aria-pressed', musicOn ? 'true' : 'false');
  }
  function chime() {
    if (!musicOn || !ac) return;
    var t = ac.currentTime + 0.05;
    tone('sine', mtof(81), t, 0.9, 0.06);
    tone('sine', mtof(88), t + 0.18, 1.2, 0.05);
  }
  document.getElementById('musicBtn').addEventListener('click', function () { setMusic(!musicOn); });

  /* ================= ESCENA (canvas) ================= */

  var cv = document.getElementById('scene');
  var ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  var W = 200, H = 100, GY = 80;

  function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  var R = rng(49);
  var stars = []; for (var i = 0; i < 38; i++) stars.push({ x: Math.floor(R() * W), y: Math.floor(R() * 52), p: R() * 6 });
  function genCity(span, wMin, wMax, hMin, hMax) {
    var a = [], x = 0;
    while (x < span) { var w = wMin + Math.floor(R() * (wMax - wMin)); a.push({ x: x, w: w, h: hMin + Math.floor(R() * (hMax - hMin)), win: Math.floor(R() * 1e6) }); x += w + Math.floor(R() * 3); }
    return a;
  }
  var farCity = genCity(640, 14, 26, 16, 36), nearCity = genCity(800, 10, 20, 10, 26);

  function hex(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
  function lerp(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
  function css(c) { return 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')'; }
  function mix(a, b, t) { return css(lerp(hex(a), hex(b), t)); }
  function rect(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), w, h); }
  function disc(cx, cy, r, c) {
    ctx.fillStyle = c;
    for (var dy = -r; dy <= r; dy++) { var dx = Math.floor(Math.sqrt(r * r - dy * dy)); ctx.fillRect(Math.round(cx - dx), Math.round(cy + dy), dx * 2 + 1, 1); }
  }
  function mod(a, n) { return ((a % n) + n) % n; }

  var DIG = { 0: '111101101101111', 1: '010110010010111', 2: '111001111100111', 3: '111001111001111', 4: '101101111001001', 5: '111100111001111', 6: '111100111101111', 7: '111001001001001', 8: '111101111101111', 9: '111101111001111' };
  function num(str, x, y, c) {
    for (var i = 0; i < str.length; i++) {
      var p = DIG[str[i]];
      for (var j = 0; j < 15; j++) if (p[j] === '1') rect(x + i * 4 + (j % 3), y + Math.floor(j / 3), 1, 1, c);
    }
  }

  function legs(x, y, f, walking, c1, c2, shoe) {
    var la = walking && f === 0 ? 1 : 0, lb = walking && f === 1 ? 1 : 0;
    rect(x + 2, y + 16, 3, 5 - la, c1); rect(x + 7, y + 16, 3, 5 - lb, c2 || c1);
    rect(x + 2, y + 21 - la, 3, 1, shoe); rect(x + 7, y + 21 - lb, 3, 1, shoe);
  }
  function drawHim(x, y, f, walking, bob) {
    var S = '#9a6743', HR = '#15100e';
    legs(x, y, f, walking, '#262a3d', null, '#0c0b12');
    rect(x + 1, y + 9 + bob, 10, 7, '#f4f1ea');
    rect(x, y + 10 + bob, 1, 5, S); rect(x + 11, y + 10 + bob, 1, 5, S);
    rect(x + 3, y + 12 + bob, 6, 2, '#2b2b36');
    rect(x + 5, y + 8 + bob, 2, 1, S);
    rect(x + 3, y + 3 + bob, 6, 5, S);
    rect(x + 4, y + 5 + bob, 1, 1, '#120d0b'); rect(x + 7, y + 5 + bob, 1, 1, '#120d0b');
    rect(x + 5, y + 7 + bob, 2, 1, '#6b412a');
    rect(x + 2, y + bob, 8, 3, HR); rect(x + 1, y + 1 + bob, 1, 3, HR); rect(x + 10, y + 1 + bob, 1, 3, HR);
    rect(x + 3, y - 1 + bob, 2, 1, HR); rect(x + 6, y - 1 + bob, 3, 1, HR);
  }
  function drawHer(x, y, f, walking, bob) {
    var S = '#d09a72', HK = '#130e18', BL = '#2f9fe0', BL2 = '#1b6fb5';
    legs(x, y, f, walking, '#2c4a7a', null, '#0c0b12');
    rect(x + 1, y + 3 + bob, 2, 13, HK); rect(x + 9, y + 3 + bob, 2, 13, HK);
    rect(x + 3, y + 9 + bob, 6, 6, '#b3182e');
    rect(x + 2, y + 9 + bob, 1, 2, '#b3182e'); rect(x + 9, y + 9 + bob, 1, 2, '#b3182e');
    rect(x + 2, y + 11 + bob, 1, 3, S); rect(x + 9, y + 11 + bob, 1, 3, S);
    rect(x + 5, y + 8 + bob, 2, 1, S);
    rect(x + 3, y + 3 + bob, 6, 5, S);
    rect(x + 4, y + 5 + bob, 1, 1, '#120d0b'); rect(x + 7, y + 5 + bob, 1, 1, '#120d0b');
    rect(x + 5, y + 7 + bob, 2, 1, '#c8283c');
    rect(x + 3, y + 4 + bob, 1, 1, '#dfe8f0');
    rect(x + 1, y + bob, 10, 4, HK);
    rect(x + 2, y + 1 + bob, 1, 9, BL); rect(x + 3, y + bob, 2, 1, BL); rect(x + 1, y + 6 + bob, 1, 5, BL2);
    rect(x + 9, y + 4 + bob, 1, 6, BL2);
  }

  function drawLamp(sx, lit, glowT, n, t) {
    var base = GY + 5;
    rect(sx, base - 26, 1, 26, '#07061a');
    rect(sx - 2, base - 30, 5, 4, lit ? '#ffe3a1' : '#3a3a66');
    rect(sx - 3, base - 31, 7, 1, '#07061a');
    if (lit) {
      var a = 0.10 + 0.03 * Math.sin(t / 500 + n);
      ctx.fillStyle = 'rgba(255,196,110,' + a + ')';
      ctx.fillRect(sx - 9, base - 38, 19, 20); ctx.fillRect(sx - 6, base - 35, 13, 14); ctx.fillRect(sx - 14, base - 6, 29, 5);
    }
    var s = String(n), w = s.length * 4 - 1;
    num(s, sx - Math.floor(w / 2), base - 40, lit ? '#ffe3a1' : '#6f6aa8');
  }
  function drawDoor(sx, n) {
    var base = GY + 5;
    rect(sx - 7, base - 24, 14, 24, '#2a1c2e'); rect(sx - 6, base - 23, 12, 23, '#5b3a29');
    rect(sx - 4, base - 20, 8, 8, '#4a2e20'); rect(sx - 4, base - 10, 8, 8, '#4a2e20');
    rect(sx + 3, base - 12, 2, 2, '#c9a45a');
    var s = String(n); num(s, sx - 3, base - 32, '#a9a4d4');
  }

  var last = 0;
  function frame(ts) {
    var dt = Math.min(0.05, (ts - last) / 1000); last = ts;
    if (state.mode === 'walking' && !reduce) {
      state.charX = Math.min(state.target, state.charX + 90 * dt);
      state.walkT += dt;
      if (state.charX >= state.target) arrive();
    }
    draw(ts);
    requestAnimationFrame(frame);
  }

  function draw(t) {
    var p = Math.min(1, state.done / N);
    var cam = state.charX - 100;
    var walking = state.mode === 'walking';
    // cielo
    var tn = hex('#0b1030'), bn = hex('#2b2552'), td = hex('#4a4b8f'), bd = hex('#f2a679');
    for (var y = 0; y < GY; y += 4) {
      var r = y / GY;
      ctx.fillStyle = css(lerp(lerp(tn, bn, r), lerp(td, bd, r), p));
      ctx.fillRect(0, y, W, 4);
    }
    // estrellas
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      ctx.globalAlpha = (1 - p) * (0.45 + 0.55 * Math.sin(t / 420 + s.p));
      rect(s.x, s.y, 1, 1, '#fff6dc');
    }
    ctx.globalAlpha = 1;
    // luna y sol
    ctx.globalAlpha = 1 - p * 0.9; disc(162, 20, 7, '#efe9c4'); ctx.globalAlpha = 1;
    if (p > 0.5) disc(140, GY - ((p - 0.5) / 0.5) * 26 + 8, 9, '#ffd27a');
    // ciudad lejana y cercana
    var farC = mix('#1b1944', '#74558c', p), nearC = mix('#120f2b', '#46335f', p);
    [[farCity, 640, 0.2, farC, false], [nearCity, 800, 0.5, nearC, true]].forEach(function (L) {
      var arr = L[0], span = L[1], f = L[2];
      for (var k = 0; k < arr.length; k++) {
        var b = arr[k], x0 = mod(b.x - cam * f, span);
        [x0, x0 - span].forEach(function (xx) {
          if (xx > W || xx + b.w < 0) return;
          rect(xx, GY - b.h, b.w, b.h, L[3]);
          if (L[4]) {
            ctx.globalAlpha = 1 - p * 0.85;
            for (var wy = 0; wy < b.h - 3; wy += 4) for (var wx = 1; wx < b.w - 1; wx += 3) if (((b.win >> ((wy / 4 + wx) % 20)) & 1)) rect(xx + wx, GY - b.h + 2 + wy, 1, 2, '#ffd98a');
            ctx.globalAlpha = 1;
          }
        });
      }
    });
    // suelo y camino
    rect(0, GY, W, H - GY, mix('#171233', '#2f2650', p));
    rect(0, GY, W, 1, mix('#0a0820', '#1d1635', p));
    rect(0, GY + 4, W, 16, mix('#262050', '#5b476f', p));
    var dash = mix('#3a3275', '#836b92', p);
    for (var dx = -mod(cam, 20); dx < W; dx += 20) rect(dx, GY + 12, 9, 1, dash);
    // farolas y puertas
    for (var k2 = 0; k2 < N; k2++) { var sx = Math.round(stationX(k2) - cam); if (sx > -20 && sx < W + 20) drawLamp(sx, k2 < state.done, 0, k2 + 1, t); }
    var d1 = Math.round(stationX(N) + 6 - cam), d2 = Math.round(stationX(N) + 32 - cam);
    if (d1 > -20 && d1 < W + 20) drawDoor(d1, 48);
    if (d2 > -20 && d2 < W + 20) drawDoor(d2, 49);
    // personajes
    var f = walking ? Math.floor(state.walkT * 6) % 2 : 0;
    var bob = walking ? (f ? -1 : 0) : (Math.floor(t / 700) % 2 ? -1 : 0) * 0;
    var fy = GY + 10 - 22;
    drawHim(76, fy, f, walking, bob);
    drawHer(100, fy, (f + 1) % 2, walking, bob);
  }

  /* ================= ARRANQUE ================= */

  renderTitle();
  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
